## Based on https://github.com/r-lib/actions/tree/v2/examples/bookdown.yaml, and
## on PredictiveEcology/fireSenseManual/.github/workflows/firesense-manual.yaml

name: LandR manual

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    ## This manual documents the modules' own branches, so it goes stale without
    ## anything changing here. Rebuild daily.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      module_ref:
        description: 'Check all modules out at this branch or tag (blank = the defaults below)'
        required: false
        type: string
        default: ''

# contents: write to deploy to GitHub Pages and to push the archive branch;
# pull-requests: write so the archive step can open its pull request, since the
# ruleset on main refuses a direct push.
permissions:
  contents: write
  pull-requests: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

## The modules are documented from their development branches. They are being
## merged to main and released, after which this becomes `main` or a tag -- one
## edit, rather than one per module. `workflow_dispatch` can override it for a
## trial build without changing this file.
env:
  MODULE_REF: development

jobs:
  build-manual-site:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      ## Module sources.
      ##
      ## These were git submodules, which record a commit: every module change
      ## then needed someone to bump a pointer here before the manual could show
      ## it. This manual is meant to track the modules' development, so each is
      ## checked out by branch instead.
      ##
      ## Adding a module here also needs a matching chapter entry in _bookdown.yml.
      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/Biomass_core
          ref: ${{ github.event.inputs.module_ref || env.MODULE_REF }}
          path: modules/Biomass_core

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/Biomass_speciesData
          ref: ${{ github.event.inputs.module_ref || env.MODULE_REF }}
          path: modules/Biomass_speciesData

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/Biomass_borealDataPrep
          ref: ${{ github.event.inputs.module_ref || env.MODULE_REF }}
          path: modules/Biomass_borealDataPrep

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/Biomass_speciesParameters
          ref: ${{ github.event.inputs.module_ref || env.MODULE_REF }}
          path: modules/Biomass_speciesParameters

      ## main, not development: this module's main is 12 commits ahead of its
      ## development branch, the opposite of the other four.
      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/Biomass_validationKNN
          ref: ${{ github.event.inputs.module_ref || 'main' }}
          path: modules/Biomass_validationKNN

      ## Which module commits this build actually used. Without submodules there
      ## is no pointer in the tree to read it off, and a scheduled build of
      ## moving branches is not reproducible from the manual's own history.
      - name: Record module versions
        run: |
          {
            echo "### Module sources"
            echo
            echo "| module | ref | commit |"
            echo "| --- | --- | --- |"
            for d in modules/*/; do
              m=$(basename "$d")
              echo "| $m | $(git -C "$d" rev-parse --abbrev-ref HEAD) | $(git -C "$d" rev-parse --short HEAD) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: PredictiveEcology/actions/install-spatial-deps@main

      - name: Install additional system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
          libarchive-dev \
          libcurl4-openssl-dev \
          libgit2-dev \
          libglpk-dev \
          libmagick++-dev \
          libxml2-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://predictiveecology.r-universe.dev/'
          Ncpus: 2
          use-public-rspm: false

      ## Installing the SpaDES stack from source is most of this job's runtime,
      ## which a daily schedule would otherwise pay every day.
      - name: Cache R library
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-rlib-${{ hashFiles('DESCRIPTION') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-rlib-${{ hashFiles('DESCRIPTION') }}-
            ${{ runner.os }}-rlib-

      - uses: PredictiveEcology/actions/install-Require@main
        with:
          GitTag: 'development'

      - uses: PredictiveEcology/actions/install-SpaDES@main

      - uses: PredictiveEcology/actions/install-Rmd-pkgs@main

      - name: Install module packages and other dependencies
        run: |
          source("install.R")
        shell: Rscript {0}

      ## The module chapters set `cache = TRUE` in their setup chunks, so knitr
      ## does cache. With `output_dir` set, bookdown writes that cache to
      ## <book_filename>_cache/ and the figures to <book_filename>_files/ --
      ## there is no `_bookdown_files` directory, which is why caching a path of
      ## that name warned "Path(s) ... do(es) not exist" on every build and
      ## nothing was ever preserved between runs.
      - name: Cache bookdown results
        uses: actions/cache@v6
        with:
          path: |
            *_cache
            *_files
          key: bookdown-${{ hashFiles('**/*Rmd') }}
          restore-keys: bookdown-

      - name: Build LandR manual
        run: |
          source("build.R")
        shell: Rscript {0}

      ## build.R writes .nojekyll and CNAME into docs/ so they reach the branch.
      ##
      ## Deploying comes before archiving on purpose. The archive step used to run
      ## first, and when it failed the deploy was skipped -- so a PDF that could
      ## not be stored stopped the site from updating at all, which is the same
      ## coupling build.R no longer has between the PDF and the HTML.
      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: true
          branch: gh-pages
          folder: docs

      ## Persist a newly archived PDF back to main, so the next build republishes
      ## it. Self-gating: build.R only writes archive/pdf/LandR-manual-v<version>.pdf
      ## when a PDF was rendered and that version is not already archived, so this
      ## is a no-op on ordinary builds and needs nobody to remember anything at
      ## release time.
      ##
      ## It opens a pull request rather than pushing to main, which the branch
      ## ruleset refuses ("Changes must be made through a pull request", GH006).
      ## A release PDF is wanted in the repository permanently, so it has to be a
      ## tracked commit on main and cannot live only on gh-pages, which every
      ## deploy rebuilds.
      - name: Archive the release PDF
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain archive/pdf)" ]; then
            echo "No newly archived PDF; nothing to commit."
            exit 0
          fi
          version="$(Rscript -e 'cat(read.dcf("DESCRIPTION", fields = "Version")[1])')"
          branch="archive/pdf-v${version}"
          ## Re-running a build for the same version must not open a second PR,
          ## and must not fail the run once one is already open.
          if gh pr list --head "${branch}" --state open --json number \
               --jq 'length' | grep -qv '^0$'; then
            echo "A pull request for ${branch} is already open; nothing to do."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add archive/pdf
          git commit -m "Archive the manual PDF for v${version}"
          ## --force, not --force-with-lease: the lease compares against a
          ## remote-tracking ref this fresh checkout has never fetched, which
          ## fails as "stale info". The branch is created and owned by this step
          ## and named for one version, so overwriting a leftover from an earlier
          ## failed run of the same build is what we want.
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${branch}"
          gh pr create --base "${GITHUB_REF_NAME}" --head "${branch}" \
            --title "Archive the manual PDF for v${version}" \
            --body "$(printf '%s\n' \
              "Produced by the manual build for v${version}." \
              "" \
              "\`archiveManualPDF()\` wrote \`archive/pdf/LandR-manual-v${version}.pdf\`, which it does only when a PDF rendered and that version is not already archived. The PDF is tracked here rather than left on \`gh-pages\`, because that branch is rebuilt by every deploy and an old PDF cannot be regenerated from current sources." \
              "" \
              "Merging it makes the next build republish it with the site's archive list.")"
